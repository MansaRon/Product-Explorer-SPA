<div class="modal-backdrop" role="presentation" (click)="onBackdropClick($event)">
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-modal-title"
    (click)="$event.stopPropagation()"
    (keypress)="$event.stopPropagation()"
  >
    <div class="modal__header">
      <h2 id="confirm-modal-title" class="modal__title">{{ title() }}</h2>
    </div>

    <div class="modal__body">
      <p class="modal__message">{{ message() }}</p>
    </div>

    <div class="modal__footer">
      <button
        type="button"
        class="modal__btn modal__btn--cancel"
        (click)="onCancel()"
        (keydown)="onCancel()"
      >
        {{ cancelLabel() }}
      </button>
      <button
        type="button"
        [class]="dangerous() ? 'modal__btn modal__btn--danger' : 'modal__btn modal__btn--confirm'"
        (click)="onConfirm()"
        (keyup)="onConfirm()"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
