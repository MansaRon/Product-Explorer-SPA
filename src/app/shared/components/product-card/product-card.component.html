<article class="product-card">
  <a
    [routerLink]="routeLink()"
    class="product-link"
    [attr.aria-label]="'View details for ' + vm().title"
  >
    <div class="product-image-container">
      <img
        [src]="vm().imageUrls[0] ?? '/assets/placeholder.jpg'"
        [alt]="vm().title"
        class="product-image"
        loading="lazy"
      />
      <button
        type="button"
        class="favorite-button"
        [class.favorite-button--active]="isFavorite()"
        (click)="handleFavoriteClick($event)"
        [attr.aria-label]="
          isFavorite()
            ? 'Remove ' + vm().title + ' from favorites'
            : 'Add ' + vm().title + ' to favorites'
        "
        [attr.aria-pressed]="isFavorite()"
      >
        <app-heart-icon [width]="20" [height]="20" [filled]="isFavorite()"  color="currentColor" />
      </button>
    </div>

    <div class="product-content">
      <div class="product-header">
        <h2 class="product-name">{{ vm().title }}</h2>
        <span class="product-category">{{ vm().category }}</span>
      </div>

      <p class="product-description">{{ vm().description }}</p>

      <div class="product-footer">
        <div class="product-rating">
          <app-star-icon [width]="16" [height]="16"  color="currentColor" />
          <span>{{ vm().rate }}</span>
        </div>

        <div class="product-price">
          <span class="price-label">Price:</span>
          <span class="price-value">{{ vm().price.toFixed(2) | currency: 'R' }}</span>
        </div>
      </div>

      <div
        class="product-stock"
        [class.product-stock--low]="vm().quantity < 10"
        [class.product-stock--out]="vm().quantity === 0"
      >
        @if (vm().quantity === 0) {
          Out of stock
        } @else if (vm().quantity < 10) {
          Only {{ vm().quantity }} left
        } @else {
          In stock
        }
      </div>
    </div>
  </a>
</article>
