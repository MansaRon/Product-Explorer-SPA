<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Verify your number</h1>
      <p class="auth-subtitle">
        We sent a 6-digit code to
        <strong>{{ phone }}</strong
        >. Enter it below to activate your account.
      </p>
    </div>

    @if (error()) {
      <div class="form-error-banner" role="alert">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="otp-form" novalidate>
      <div class="form-field">
        <label for="otp" class="form-label">
          OTP Code <span class="required" aria-label="required">*</span>
        </label>
        <input
          type="text"
          id="otp"
          formControlName="otp"
          class="form-input otp-input"
          [class.form-input--error]="hasError('otp')"
          [attr.aria-invalid]="hasError('otp')"
          [attr.aria-describedby]="hasError('otp') ? 'otp-error' : null"
          placeholder="123456"
          maxlength="6"
          inputmode="numeric"
          autocomplete="one-time-code"
        />
        @if (hasError('otp')) {
          <span id="otp-error" class="error-message" role="alert">
            {{ getErrorMessage('otp') || 'Please enter the 6-digit code' }}
          </span>
        }
      </div>

      <button
        type="submit"
        class="submit-button"
        [disabled]="loading()"
        [attr.aria-busy]="loading()"
      >
        @if (loading()) {
          <span class="spinner" aria-hidden="true"></span>
        }
        Verify Account
      </button>
    </form>

    <div class="auth-footer">
      <p class="auth-redirect">
        Didn't receive a code?
        <a routerLink="/register" class="auth-link auth-link--bold">Register again</a>
      </p>
      <a routerLink="/login" class="auth-link">Back to Sign In</a>
    </div>
  </div>
</div>
