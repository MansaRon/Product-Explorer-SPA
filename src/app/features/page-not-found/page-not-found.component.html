<div class="not-found-container">
  <div class="not-found-content">
    <!-- 404 Illustration -->
    <div class="illustration" role="img" aria-label="404 Error - Page not found">
      <app-search-icon
        [width]="96"
        [height]="96"
        color="currentColor"
        class="illustration__search"
      />
      <app-alert-triangle-icon
        [width]="40"
        [height]="40"
        color="var(--color-danger)"
        class="illustration__alert"
      />
    </div>

    <!-- Error Message -->
    <div class="error-content">
      <h1 class="error-code">404</h1>
      <h2 class="error-title">Page Not Found</h2>
      <p class="error-message">
        Oops! The page you're looking for doesn't exist. It might have been moved or deleted.
      </p>
    </div>

    <!-- Countdown -->
    <div class="countdown-message" role="status" aria-live="polite">
      <p>
        Redirecting to home page in <strong>{{ countdown() }}</strong> seconds...
      </p>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button
        type="button"
        class="button button--primary"
        (click)="goHome()"
        aria-label="Go to home page"
      >
        <app-home-icon [width]="20" [height]="20" color="currentColor" />
        Go to Home
      </button>

      <button
        type="button"
        class="button button--secondary"
        (click)="goBack()"
        aria-label="Go back to previous page"
      >
        <app-arrow-left-icon [width]="20" [height]="20" color="currentColor" />
        Go Back
      </button>
    </div>

    <!-- Helpful Links -->
    <div class="helpful-links">
      <h3 class="links-title">Looking for something?</h3>
      <nav aria-label="Quick navigation links">
        <ul class="links-list">
          <li>
            <a href="/catalog" class="link">Browse Catalog</a>
          </li>
          <li>
            <a href="/cart" class="link">View Cart</a>
          </li>
          <li>
            <a href="/favorites" class="link">My Favorites</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>
